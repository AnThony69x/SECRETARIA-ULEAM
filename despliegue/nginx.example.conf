# Nginx: ejemplo de bloque "server". Ajusta dominio, rutas, certificado y el socket de PHP-FPM.
# root debe apuntar a la carpeta wordpress-7.1.3 (NO a la raíz del repositorio: ahí viven .git, credenciales.txt y los scripts).
server {
    listen 443 ssl http2;
    server_name TU-DOMINIO;
    ssl_certificate     /ruta/al/certificado.pem;
    ssl_certificate_key /ruta/a/la/clave.pem;

    root  /var/www/SECRETARIA-ULEAM/wordpress-7.1.3;
    index index.php;

    client_max_body_size 64M;   # subir PDF grandes desde el administrador (hay actas de hasta ~60 MB)

    # Cabeceras de seguridad (HSTS solo cuando el HTTPS ya funcione bien).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nunca ejecutar PHP desde lo que se sube (debe ir antes del bloque PHP general).
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;   # enlaces bonitos
    }
    location ~ \.php$ {
        try_files $uri =404;   # evita ejecutar rutas inventadas tipo /x.jpg/x.php
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 120s;
    }
    location ~ /\.(?!well-known) { deny all; }
    location = /wp-config.php    { deny all; }
    location ~* \.(pdf|jpg|jpeg|png|webp|svg|css|js|woff2)$ { expires 30d; add_header Cache-Control "public"; }   # los add_header de arriba no se heredan aquí: repítelos si quieres cabeceras en estáticos
}
server {
    listen 80;
    server_name TU-DOMINIO;
    return 301 https://$host$request_uri;
}
